name: Malfunction report
description: A unit is behaving differently from specification
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. The single most useful thing you can provide
        is a reliable way to reproduce it — a defect that can be repeated is a
        defect that can be corrected.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: |
        Expected: the request returns 200 with the user object
        Actual:   the request returns 500
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that triggers it. A failing test is ideal.
      placeholder: |
        1. Start the app with `just dev`
        2. POST /users with an empty body
        3. Observe the 500
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Pasted here, it is formatted automatically — no backticks needed.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.4.2, or the commit SHA
    validations:
      required: true
