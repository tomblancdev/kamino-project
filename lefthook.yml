# Git hooks, run by lefthook — a single Go binary already in the base image, so
# there is no Python or Node runtime to install just to lint a commit.
#
# Installed automatically by dev-init when this file exists.
#
#   lefthook run pre-commit    run the checks by hand
#   LEFTHOOK=0 git commit      bypass everything, once
#
# Hooks run wherever git runs — which is inside the container. Commit from a
# host terminal and the tools below will not be on PATH.

pre-commit:
  parallel: true
  commands:
    # Catches an AWS key or a token before it becomes permanent history.
    secrets:
      run: gitleaks git --staged --redact --no-banner

    # These discover their own files with `git ls-files` rather than lefthook's
    # {staged_files} template. The template is empty when a glob matches nothing,
    # and under `--all-files` (how CI runs) lefthook still invokes the command,
    # so shellcheck and hadolint fail on usage instead of being skipped.
    shell:
      run: |
        files=$(git ls-files '*.sh' '*.bash')
        [ -n "$files" ] || exit 0
        # shellcheck disable=SC2086
        shellcheck $files

    containerfile:
      run: |
        files=$(git ls-files 'Containerfile' 'Dockerfile' '*.Containerfile' '*.Dockerfile')
        [ -n "$files" ] || exit 0
        # shellcheck disable=SC2086
        hadolint $files

    # Cheap hygiene that reviewers should never have to mention.
    conflict-markers:
      run: |
        if grep -InE '^(<<<<<<<|>>>>>>>) ' {staged_files} 2>/dev/null; then
          echo "unresolved merge conflict markers"; exit 1
        fi

commit-msg:
  commands:
    conventional:
      # dev-commit-msg lives in the base image, not in this repo.
      run: dev-commit-msg {1}

pre-push:
  commands:
    # A full-history scan is too slow for every commit, but fine before push.
    secrets-history:
      run: gitleaks git --redact --no-banner
